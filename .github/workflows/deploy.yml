name: Build, Check & Deploy

# This repo had no GitHub Actions workflow of its own before — Cloudflare
# Pages' git integration (if connected) handled build+deploy on its own.
# This adds a real build gate (a broken commit is caught here, not live)
# and moves deploy to be Actions-driven via Cloudflare's own action, so
# there is exactly one place a deploy can go wrong instead of two competing
# build systems.
#
# USER ACTION REQUIRED before this can deploy successfully — see the
# secrets referenced below (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
# and the projectName value, which must match a real Cloudflare Pages
# project. If Cloudflare Pages' own git integration is still connected to
# this repo, disconnect it first (Cloudflare dashboard → Pages project →
# Settings → Builds & deployments) — otherwise every push triggers two
# independent deploys.
on:
  push:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A full Vite production build parses and bundles every file — the
      # strongest, cheapest available signal that a commit didn't break the
      # frontend. No test suite (deliberately — see the project's own
      # CLAUDE.md), so this is the real gate today.
      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build-and-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the real Cloudflare Pages project name exactly —
          # update this if the project is named differently.
          projectName: tech-jazeera-frontend
          directory: dist
          branch: main
